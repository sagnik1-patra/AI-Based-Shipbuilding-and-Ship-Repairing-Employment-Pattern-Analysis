project: AI-Based Shipbuilding and Ship Repairing Employment Pattern Analysis
optimization_algorithm: AIS Clonal Selection
dataset: 10.3_Employment_in_Ship_Building_Ship_Repairing_Companies_As_on_31st_March_1996.csv
historical_year: 1996
target: Employment_Category
selected_features:
- Sector
- Officers_Share
- Supervisors_Share
best_model: Random Forest
validation: Leave-One-Out
ais_parameters:
  population_size: 12
  generations: 15
  clone_factor: 4
  replacement_rate: 0.25
thresholds:
  low_max: 106.33333333333333
  medium_max: 1361.9999999999998
random_state: 42
